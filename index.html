<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Number Quiz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Using a green gradient to mimic the background in image_d3d153.png */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-container {
            background-color: rgba(255, 255, 255, 0.9);
            width: 350px;
            height: 600px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        #score-display {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
        }

        #tamil-word {
            font-size: 3rem;
            color: #1a237e;
            margin: 10px 0;
            font-weight: bold;
        }

        #phonetic {
            font-size: 1.5rem;
            color: #3949ab;
            margin-bottom: 40px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-top: auto;
            margin-bottom: 40px;
        }

        .option-btn {
            background: white;
            border: 2px solid #0d47a1;
            border-radius: 12px;
            padding: 15px;
            font-size: 2rem;
            color: #0d47a1;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background-color: #e3f2fd;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .correct {
            background-color: #4caf50 !important;
            color: white !important;
            border-color: #2e7d32 !important;
        }

        .wrong {
            background-color: #f44336 !important;
            color: white !important;
            border-color: #c62828 !important;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="score-display">Score: <span id="score">0</span></div>
        
        <div id="tamil-word">பதினொன்று</div>
        <div id="phonetic">pathinonru</div>

        <div class="options-grid" id="options-container">
            <!-- Buttons will be generated by JavaScript -->
        </div>
    </div>

    <script>
         const numbers = [
            { tamil: "ஒன்று", phonetic: "ondru", value: 1 },
            { tamil: "இரண்டு", phonetic: "irandu", value: 2 },
            { tamil: "மூன்று", phonetic: "moondru", value: 3 },
            { tamil: "நான்கு", phonetic: "naangu", value: 4 },
            { tamil: "ஐந்து", phonetic: "aindhu", value: 5 },
            { tamil: "ஆறு", phonetic: "aaru", value: 6 },
            { tamil: "ஏழு", phonetic: "ezhu", value: 7 },
            { tamil: "எட்டு", phonetic: "ettu", value: 8 },
            { tamil: "ஒன்பது", phonetic: "onbadhu", value: 9 },
            { tamil: "பத்து", phonetic: "pathu", value: 10 },
            { tamil: "பதினொன்று", phonetic: "pathinonru", value: 11 },
            { tamil: "பன்னிரண்டு", phonetic: "pannirandu", value: 12 },
            { tamil: "பதிமூன்று", phonetic:"pathimondru", value: 13 },
            { tamil: "பதினான்கு", phonetic:"pathinangu", value: 14 },
            { tamil: "பதினைந்து", phonetic:"pathinaindhu", value: 15 },
            { tamil: "பதினாறு", phonetic:"pathinaaru", value: 16 },
            { tamil: "பதினேழு", phonetic:"pathinezhu", value: 17 },
            { tamil: "பதினெட்டு", phonetic:"pathinettu", value: 18 },
            { tamil: "பத்தொன்பது", phonetic:"pathinonbadhu", value: 19 },
            { tamil: "இருபது", phonetic:"erubathu", value: 20 },
        ];

        let score = 0;
        let currentIndex = 0;
        let shuffledQuestions = [];

        function initGame() {
            score = 0;
            currentIndex = 0;
            document.getElementById('score').innerText = score;
            // Create a shuffled version of the full question list
            shuffledQuestions = [...numbers].sort(() => Math.random() - 0.5);
            nextQuestion();
        }

        function nextQuestion() {
            // Check if we have run out of questions
            if (currentIndex >= shuffledQuestions.length) {
                showGameOver();
                return;
            }

            const currentNumber = shuffledQuestions[currentIndex];
            
            document.getElementById('tamil-word').innerText = currentNumber.tamil;
            document.getElementById('phonetic').innerText = currentNumber.phonetic;
            
            // Generate 4 options (1 correct + 3 random distractors)
            let options = [currentNumber.value];
            while(options.length < 4) {
                let randomVal = Math.floor(Math.random() * 12) + 1;
                if(!options.includes(randomVal)) {
                    options.push(randomVal);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, currentNumber.value);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, button, correctAnswer) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.style.pointerEvents = 'none');

            if (selected === correctAnswer) {
                button.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;
                // Increment index to move to the next unique question
                currentIndex++;
            } else {
                button.classList.add('wrong');
                buttons.forEach(b => {
                    if(parseInt(b.innerText) === correctAnswer) b.classList.add('correct');
                });
            }


            setTimeout(nextQuestion, 1500);
        }

        function showGameOver() {
            const container = document.querySelector('.game-container');
            container.innerHTML = `
                <div id="score-display">Final Score: ${score}</div>
                <h1 style="color: #1a237e; margin-top: 50px;">Vanakkaam!</h1>
                <p>You have finished all 12 numbers.</p>
                <button class="option-btn" onclick="location.reload()" style="margin-top: 20px;">Play Again</button>
            `;
        }

        initGame();
    </script>


</body>
</html>
